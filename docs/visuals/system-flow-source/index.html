<!doctype html>

<body><div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1440" data-height="900">

<script>
const tl=gsap.timeline({paused:true});
const phases=["input","plan","engineer","evidence","review","verdict","human","tui"];
phases.forEach((id,i)=>{const t=0.3+i*1.28;tl.fromTo("#p-"+id,{opacity:0},{opacity:1,duration:0.18,ease:"power2.out"},t);tl.to("#p-"+id,{opacity:0,duration:0.4,ease:"power2.in"},t+0.72)});

</script></body></html>
