<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Agentic Harness workspace layout</title>
<desc id="desc">A simple layout skeleton: runs sidebar on the left, run details and changes above three agent status panels, activity log below, and footer shortcuts.</desc>
