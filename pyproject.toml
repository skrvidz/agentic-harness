[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-agent-harness"
version = "0.1.0"
description = "An experimental local agentic harness with engineer and reviewer turns"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.14.2",
  "rich>=13.7",
  "textual>=0.70",
  "textual-image>=0.8",
  "pillow>=13.0.0",
  "typer>=0.16",
]

[project.scripts]
agent-harness = "rector_harness.cli:main"

[tool.setuptools.packages.find]
include = ["rector_harness*"]
